[workspace]
members = ["server", "client", "olympus-core", "olympus-server"]
resolver = "2"

[workspace.package]
version = "16.0.0"
edition = "2021"
authors = ["Olympus Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
ractor = { version = "0.9", features = ["async-trait"] }
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
axum = "0.8"
futures = "0.3"
futures-util = "0.3"

